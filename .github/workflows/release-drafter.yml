name: Release Drafter
# Fork: automatic upstream CI is disabled. This workflow needs upstream bot secrets.
on:
    workflow_dispatch: {}
concurrency: ${{ github.workflow }}
permissions: {}
jobs:
    draft:
        uses: matrix-org/matrix-js-sdk/.github/workflows/release-drafter-workflow.yml@develop # zizmor: ignore[unpinned-uses]
        permissions:
            contents: write
        with:
            include-changes: element-hq/element-web~$VERSION
