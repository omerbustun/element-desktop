name: Pull Request
# Fork: automatic upstream CI is disabled. This workflow needs upstream bot secrets.
on:
    workflow_dispatch: {}
permissions: {}
jobs:
    action:
        uses: matrix-org/matrix-js-sdk/.github/workflows/pull_request.yaml@develop # zizmor: ignore[unpinned-uses]
        permissions:
            pull-requests: write
        secrets:
            ELEMENT_BOT_TOKEN: ${{ secrets.ELEMENT_BOT_TOKEN }}
