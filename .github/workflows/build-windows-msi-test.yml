name: Build Windows MSI
on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Architecture to build'
        required: true
        default: 'x64'
        type: choice
        options:
          - x64
          - ia32
  #push:
  #  branches: [ main ]
  #  paths:
  #    - 'package.json'
  #    - 'yarn.lock'

jobs:
  build:
    runs-on: windows-2022
    env:
      SIGNTOOL_PATH: "C:/Program Files (x86)/Windows Kits/10/bin/10.0.22000.0/x86/signtool.exe"
    
    steps:
      - uses: actions/checkout@v4

      # Set up build tools for 32-bit (using "x86")
      - name: Set up build tools (32-bit)
        if: ${{ github.event.inputs.arch == 'ia32' }}
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: "x86"

      # Set up build tools for 64-bit
      - name: Set up build tools (64-bit)
        if: ${{ github.event.inputs.arch != 'ia32' }}
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: ${{ github.event.inputs.arch }}

      # Install TCL (needed for native modules)
      - name: Install tclsh
        shell: pwsh
        run: |
          choco install -y magicsplat-tcl-tk --no-progress
          echo "${HOME}/AppData/Local/Apps/Tcl86/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # Install NASM (needed for native modules)
      - name: Install NetWide Assembler
        shell: pwsh
        run: |
          choco install -y nasm --no-progress
          echo "C:/Program Files/NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # Install Rust toolchain (common commands)
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      # Add Rust target for 32-bit
      - name: Install Rust target (32-bit)
        if: ${{ github.event.inputs.arch == 'ia32' }}
        run: rustup target add i686-pc-windows-msvc

      # Add Rust target for 64-bit
      - name: Install Rust target (64-bit)
        if: ${{ github.event.inputs.arch != 'ia32' }}
        run: rustup target add x86_64-pc-windows-msvc

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Fetch Element Web
        run: yarn run fetch --noverify --cfgdir ""

      # Build Native Modules for 32-bit
      - name: Build Native Modules (32-bit)
        if: ${{ github.event.inputs.arch == 'ia32' }}
        run: |
          refreshenv
          yarn build:native --target i686-pc-windows-msvc

      # Build Native Modules for 64-bit
      - name: Build Native Modules (64-bit)
        if: ${{ github.event.inputs.arch != 'ia32' }}
        run: |
          refreshenv
          yarn build:native --target x86_64-pc-windows-msvc

      - name: Build TypeScript and Resources
        run: |
          yarn run build:ts
          yarn run build:res

      # Build App for 32-bit
      - name: Build App (32-bit)
        if: ${{ github.event.inputs.arch == 'ia32' }}
        run: yarn electron-builder --publish never -w --ia32

      # Build App for 64-bit
      - name: Build App (64-bit)
        if: ${{ github.event.inputs.arch != 'ia32' }}
        run: yarn electron-builder --publish never -w

      - name: Upload MSI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: element-desktop-${{ github.event.inputs.arch }}-msi
          path: dist/**/*.msi
          retention-days: 5
