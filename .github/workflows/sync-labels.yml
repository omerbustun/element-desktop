name: Sync labels
# Fork: automatic upstream CI is disabled. This workflow needs upstream bot secrets.
on:
    workflow_dispatch: {}
permissions: {} # Uses ELEMENT_BOT_TOKEN
jobs:
    sync-labels:
        uses: element-hq/element-meta/.github/workflows/sync-labels.yml@7f2f93fb9b52ece7a0998f60e64862aa203c1746
        with:
            LABELS: |
                element-hq/element-web
                .github/labels.yml
            DELETE: true
            WET: true
        secrets:
            ELEMENT_BOT_TOKEN: ${{ secrets.ELEMENT_BOT_TOKEN }}
